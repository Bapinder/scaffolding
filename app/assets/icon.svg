<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#1d4667"/>
  <!-- A braced scaffold bay. Two standards, three lifts of ledger, and a zig-zag of
       diagonal bracing across both bays — the bracing is what makes it read as scaffold
       rather than a ladder or a gate. Everything meets on the centreline of a tube, so
       nothing overhangs and there are no nubs at small sizes. -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- bracing sits behind the tubes, slightly thinner and knocked back -->
    <g stroke-width="40" opacity="0.5">
      <path d="M304 512 L720 216"/>
      <path d="M304 808 L720 512"/>
    </g>
    <!-- standards -->
    <g stroke-width="54">
      <path d="M304 168 V856"/>
      <path d="M720 168 V856"/>
      <!-- ledgers -->
      <path d="M304 216 H720"/>
      <path d="M304 512 H720"/>
      <path d="M304 808 H720"/>
    </g>
  </g>
</svg>
