<title>Scaffold Job Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Three colours do all the work: the brand colour, green for up, red for late. */
:root{
  --bg:#f2f4f6; --panel:#ffffff; --panel-2:#f7f9fb; --ink:#131a21; --ink-2:#5d6b78;
  --line:#e0e5ea; --line-2:#edf0f3;
  --accent:#1d4667; --accent-ink:#ffffff;
  --up:#0f7a48; --up-bg:#e6f4ec;
  --late:#a5271f; --late-bg:#fbeae8;
  --shadow:0 1px 2px rgba(19,26,33,.05),0 8px 22px rgba(19,26,33,.06);
  --sans:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --cond:"Barlow Condensed","Barlow",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --panel:#161d25; --panel-2:#1b232c; --ink:#e6ecf2; --ink-2:#94a3b2;
  --line:#242e39; --line-2:#1e2731;
  --accent:#8fbde6; --accent-ink:#0a141d;
  --up:#48c98a; --up-bg:#102a1e;
  --late:#f0817a; --late-bg:#2c1615;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0d1218; --panel:#161d25; --panel-2:#1b232c; --ink:#e6ecf2; --ink-2:#94a3b2;
  --line:#242e39; --line-2:#1e2731;
  --accent:#8fbde6; --accent-ink:#0a141d;
  --up:#48c98a; --up-bg:#102a1e;
  --late:#f0817a; --late-bg:#2c1615;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-family:var(--cond);font-weight:700;letter-spacing:.01em;text-wrap:balance}
h2{font-size:26px} h3{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 90px}

header.top{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:900px;margin:0 auto;padding:9px 16px;display:flex;gap:10px;align-items:center}
.brand{font-family:var(--cond);font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
nav.tabs{display:flex;gap:2px}
nav.tabs button{background:none;border:0;padding:7px 13px;border-radius:8px;color:var(--ink-2);cursor:pointer;font-weight:600;font-size:15px}
nav.tabs button:hover{background:var(--panel-2);color:var(--ink)}
nav.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.icon-btn.colour{background:var(--accent);border-color:transparent}
.saving-chip{font-size:12.5px;color:var(--ink-2);opacity:0;transition:opacity .2s;white-space:nowrap}
.who-btn{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer;white-space:nowrap}
@media(max-width:620px){
  .top-in{flex-wrap:wrap}
  .brand{order:1;flex:1} .icon-btn,.who-btn{order:2}
  nav.tabs{order:3;width:100%;justify-content:space-between}
  nav.tabs button{flex:1;padding:7px 4px;text-align:center;font-size:14px}
}
/* colour popover */
.pop{position:absolute;right:12px;top:52px;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;width:246px;display:none}
.pop.on{display:block}
.pop h4{font-family:var(--cond);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.sw-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;position:relative}
.sw.on{border-color:var(--ink)}
.sw.custom{background:conic-gradient(#c0392b,#e0a020,#1f7a4a,#2980b9,#8e44ad,#c0392b);overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;background:var(--panel-2);border:0;padding:7px 0;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--ink-2)}
.small{font-size:14px} .tiny{font-size:12.5px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:8px}
.btn.big{width:100%;padding:15px;font-size:17px}
.btn.up{background:var(--up);color:#fff}
.btn.danger{background:var(--late-bg);color:var(--late)}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.tag.up{background:var(--up-bg);color:var(--up);border-color:transparent}
.tag.late{background:var(--late-bg);color:var(--late);border-color:transparent}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;background:var(--ink-2)}
label.f{display:block;font-family:var(--cond);font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 4px;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=date],input[type=number],input[type=tel],select,textarea{
  width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
textarea{min-height:80px;resize:vertical}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.f-row{grid-template-columns:1fr}}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px}
.empty{padding:24px;text-align:center;color:var(--ink-2)}
hr.sep{border:0;border-top:1px solid var(--line-2);margin:16px 0}
.stack{display:grid;gap:12px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{padding:14px}
.stat .n{font-family:var(--cond);font-size:30px;font-weight:700;line-height:1.1}
.stat .l{font-family:var(--cond);font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;font-weight:700}

.job{padding:14px;cursor:pointer;display:grid;gap:7px}
.job:hover{border-color:var(--accent)}
.job .hd{display:flex;gap:10px;align-items:center}
.job .hd strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref{font-size:13px;color:var(--ink-2)}
.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dow{background:var(--panel-2);padding:7px 0;font-family:var(--cond);font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;text-align:center}
.cal .day{background:var(--panel);min-height:84px;padding:6px;font-size:13px;overflow:hidden}
.cal .day.off{background:var(--panel-2);color:var(--ink-2)}
.cal .day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 5px}
.dn{font-weight:700;font-size:12.5px}
.ev{margin-top:3px;padding:2px 6px;border-radius:5px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.up{background:var(--up-bg);color:var(--up)}
.ev.down{background:var(--panel-2);color:var(--ink-2)}
.ev.insp{background:var(--late-bg);color:var(--late)}
@media(max-width:620px){.cal .day{min-height:58px;padding:3px}.ev{font-size:0;height:5px;padding:0;margin-top:3px;border-radius:3px}
  .ev.up{background:var(--up)} .ev.down{background:var(--ink-2)} .ev.insp{background:var(--late)}}

.scrim{position:fixed;inset:0;background:rgba(8,12,18,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);background:var(--bg);z-index:61;transform:translateX(100%);transition:transform .18s ease;overflow-y:auto}
.drawer.on{transform:none}
.dhd{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;z-index:2}
.dhd strong{flex:1}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--ink-2);padding:0 6px}
.dbody{padding:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,18px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:90;opacity:0;transition:.16s;pointer-events:none;font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{margin-bottom:14px;padding:11px 14px;border-radius:10px;background:var(--late-bg);color:var(--late);font-size:14px;font-weight:600}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer;color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* pick a date */
.dfield{display:grid;gap:4px}
.dbtn{width:100%;text-align:left;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);cursor:pointer;font-weight:600}
.dbtn.empty{color:var(--ink-2);font-weight:400}
.dbtn.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.dp{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px;margin-top:6px;box-shadow:var(--shadow)}
.dp-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp-hd strong{font-family:var(--cond);font-size:17px}
.dp-nav{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:17px;line-height:1}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dp-grid .wd{text-align:center;font-family:var(--cond);font-size:11px;color:var(--ink-2);text-transform:uppercase;padding-bottom:2px}
.dcell{aspect-ratio:1;border:0;border-radius:8px;background:var(--panel-2);cursor:pointer;font-size:14px;color:var(--ink);padding:0}
.dcell:hover{background:color-mix(in srgb,var(--accent) 16%,var(--panel-2))}
.dcell.off{opacity:.38}
.dcell.td{outline:1.5px solid var(--ink-2)}
.dcell.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.dp-foot{display:flex;gap:8px;margin-top:9px}
.dp-foot button{flex:1}
/* site photo */
.photo{width:100%;border-radius:12px;display:block;border:1px solid var(--line)}
.photo-sm{width:100%;max-height:190px;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--line);cursor:pointer}
/* signature */
.sigwrap{border:1.5px dashed var(--line);border-radius:10px;background:#fff;padding:6px}
#sigPad{width:100%;height:170px;display:block;touch-action:none;cursor:crosshair;background:#fff;border-radius:6px}
.sigshot{width:100%;max-width:320px;background:#fff;border:1px solid var(--line);border-radius:8px;display:block}
.doc{width:100%;border:1px solid var(--line);border-radius:10px;display:block;background:#fff}
.thumb{width:56px;height:56px;border-radius:9px;object-fit:cover;flex:none;border:1px solid var(--line)}
.job .hd .thumb{margin-right:2px}
/* the little offline map */
.minimap{width:100%;height:auto;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.people{display:grid;gap:8px}
.person{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.person:last-child{border-bottom:0}
.person .nm{flex:1}
@media print{header.top,.btn,.chips,nav.tabs{display:none!important}body{background:#fff}}
</style>

<header class="top">
  <div class="top-in">
    <span class="brand" id="brandName">Scaffold Tracker</span>
    <nav class="tabs" id="tabs">
      <button data-view="today">Today</button>
      <button data-view="jobs">Jobs</button>
      <button data-view="cal">Calendar</button>
      <button data-view="docs">Docs</button>
      <button data-view="settings">Settings</button>
    </nav>
    <span id="savingChip" class="saving-chip"></span>
    <button class="icon-btn colour" id="colourBtn" title="Change the colour" aria-label="Change the colour"></button>
    <button class="who-btn" id="whoBtn">Sign in</button>
  </div>
</header>

<div class="pop" id="colourPop">
  <h4>Colour</h4>
  <div class="sw-row" id="swatches"></div>
  <h4>Light or dark</h4>
  <div class="seg" id="modeSeg">
    <button data-mode="system">Auto</button><button data-mode="light">Light</button><button data-mode="dark">Dark</button>
  </div>
</div>

<div class="wrap"><div id="app"></div></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"><div class="dhd"><strong id="drawerTitle">Job</strong><button class="x" id="drawerClose">&times;</button></div><div class="dbody" id="drawerBody"></div></aside>
<div class="toast" id="toast"></div>

<script id="app-state" type="application/json">null</script>
<script>
"use strict";
/* ------------------------------------------------------------------
 * Scaffold Job Tracker — one job, one date up, one date down.
 * Shared through the published link when it can be; otherwise kept
 * on this device. Export a backup from Settings.
 * ------------------------------------------------------------------ */

const LS_KEY='scaffold-tracker-v1', LS_ME='scaffold-tracker-me', LS_THEME='scaffold-tracker-theme';
const SS_UI='scaffold-tracker-ui';
const STATUS={ booked:{label:'Booked in'}, up:{label:'Up'}, down:{label:'Down'} };
const COLOURS=[
  {name:'Navy',    hex:'#1d4667'},
  {name:'Graphite',hex:'#3a4149'},
  {name:'Teal',    hex:'#14555e'},
  {name:'Burgundy',hex:'#7a2b34'},
  {name:'Indigo',  hex:'#3a3a72'},
  {name:'Bronze',  hex:'#8a5a12'}
];

let S=null, me=null, view='today', mode='local', tpl=null, roMsg='', themeMode=null;
let filter={status:'active', q:''}, calCursor=null, openJob=null;

const uid=p=>(p||'id')+'_'+Math.random().toString(36).slice(2,9);
const isoOf=d=>{const x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
const todayISO=()=>isoOf(new Date());
const nowISO=()=>new Date().toISOString();
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plus=(base,n)=>{const d=new Date(base+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d);};
function days(a,b){ if(!a||!b) return null; return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5); }
function fmt(d){ if(!d) return '—'; const x=new Date(d.slice(0,10)+'T00:00:00');
  return x.toLocaleDateString(undefined,{day:'numeric',month:'short',year:x.getFullYear()===new Date().getFullYear()?undefined:'2-digit'}); }
function rel(d){ const n=days(todayISO(),d); if(n===null) return '';
  return n===0?'today':n===1?'tomorrow':n===-1?'yesterday':n>0?'in '+n+' days':n*-1+' days ago'; }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }

function blankState(){
  return { v:2, company:'My Scaffolding Ltd',
    settings:{currency:'£', inspections:true, inspectionDays:7, colour:'#1d4667', yard:null, logo:null, details:''},
    seq:1, members:[], jobs:[] };
}

/* ---------- people ---------- */
const member=id=>S.members.find(m=>m.id===id);
const mName=id=>(member(id)||{}).name||'someone';
function initials(n){ return n.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function avatar(id){ const m=member(id); return m? `<span class="av" title="${esc(m.name)}">${esc(m.initials||initials(m.name))}</span>`:''; }
function addMember(name,role,cisrs){
  const m={id:uid('m'),name:name.trim(),role:role||'',cisrs:(cisrs||'').trim(),initials:initials(name),active:true};
  S.members.push(m); save(); return m;
}

/* ---------- jobs ---------- */
function newJob(d){
  const j=Object.assign({
    id:uid('j'), ref:'JOB-'+String(S.seq++).padStart(4,'0'),
    client:'', site:'', contact:'', phone:'', notes:'', status:'booked',
    value:0, hireRate:0, crew:[], location:null, photo:null,
    dates:{erect:'', up:'', dismantle:'', down:''},
    inspection:{next:'', last:'', by:''},
    activity:[], createdAt:nowISO(), updatedAt:nowISO()
  }, d||{});
  S.jobs.unshift(j); log(j,'created the job'); save(); return j;
}
function log(j,text){ (j.activity=j.activity||[]).unshift({at:nowISO(),by:me,text});
  j.activity=j.activity.slice(0,80); j.updatedAt=nowISO(); }

const isUp=j=>j.status==='up';
const isActive=j=>j.status!=='down';
function daysUp(j){ return j.dates.up? Math.max(0,days(j.dates.up, j.dates.down||todayISO())) : 0; }
function hireEarned(j){ return Math.round((Number(j.hireRate)||0)*daysUp(j)/7); }
const money=n=>(S.settings.currency||'£')+(Number(n)||0).toLocaleString(undefined,{maximumFractionDigits:0});
function inspectionDue(j){ return (S.settings.inspections && isUp(j) && j.inspection && j.inspection.next) ? j.inspection.next : null; }
function inspectionLate(j){ const d=inspectionDue(j); return d && d<todayISO(); }

function markUp(j){
  if(!guard()) return;
  j.status='up'; j.dates.up=j.dates.up||todayISO();
  if(S.settings.inspections) j.inspection={next:plus(j.dates.up, Number(S.settings.inspectionDays)||7), last:'', by:''};
  log(j,'put the scaffold UP'); save(); render(); drawJob(); toast('Marked up');
}
function markDown(j){
  if(!guard()) return;
  j.status='down'; j.dates.down=j.dates.down||todayISO();
  j.inspection={next:'',last:j.inspection&&j.inspection.last||'',by:j.inspection&&j.inspection.by||''};
  log(j,'took the scaffold DOWN'); save(); render(); drawJob(); toast('Marked down');
}
/* Reminders follow the setting: off clears them, on gives every standing
   scaffold a date again, counted from its last inspection or the day it went up. */
function reseedInspections(){
  const n=Number(S.settings.inspectionDays)||7;
  S.jobs.forEach(j=>{
    if(!S.settings.inspections || !isUp(j)){ j.inspection={next:'',last:j.inspection&&j.inspection.last||'',by:j.inspection&&j.inspection.by||''}; return; }
    const from=(j.inspection&&j.inspection.last)||j.dates.up||todayISO();
    j.inspection={next:plus(from,n), last:(j.inspection&&j.inspection.last)||'', by:(j.inspection&&j.inspection.by)||''};
  });
}

function markInspected(j){
  if(!guard()) return;
  const n=Number(S.settings.inspectionDays)||7;
  j.inspection={next:plus(todayISO(),n), last:todayISO(), by:me};
  log(j,'inspected the scaffold'); save(); render(); drawJob(); toast('Next one due '+fmt(j.inspection.next));
}
let pendingYes=null;
/* The browser's own confirm() box never appears inside the published page,
   so anything that needs a second press asks for it on the page itself. */
function askFirst(title, question, yesLabel, onYes){
  pendingYes=onYes;
  openDrawer(title, `<div class="card pad stack">
    <p style="margin:0">${question}</p>
    <div class="row"><button class="btn danger" data-act="yes">${yesLabel}</button>
    <button class="btn ghost" data-act="no">Cancel</button></div></div>`);
}
/* Same client, same rates, clean dates — most jobs are last week's job at a new address. */
function duplicateJob(j){
  if(!guard()) return;
  const copy=newJob({
    client:j.client, site:'', contact:j.contact, phone:j.phone,
    notes:j.notes, value:j.value, hireRate:j.hireRate, crew:(j.crew||[]).slice(),
    dates:{erect:'',up:'',dismantle:'',down:''}
  });
  log(copy,'copied from '+j.ref);
  save(); openJob=copy.id; render(); drawJob();
  toast('Copied — put the new address and dates in');
}
const telHref=p=>'tel:'+String(p||'').replace(/[^\d+]/g,'');

/* Draw a document on a canvas so it can be saved as a picture and sent on. */
function docCanvas(lines, opts){
  opts=opts||{};
  const W=1000, pad=56;
  const logo=opts.logo, logoH=logo? Math.min(84, logo.height) : 0;
  const logoW=logo? Math.round(logo.width*(logoH/logo.height)) : 0;
  const c=document.createElement('canvas');
  const ctx=c.getContext('2d');
  const font=(sz,w)=>`${w||400} ${sz}px "Barlow", -apple-system, "Segoe UI", Arial, sans-serif`;
  /* first pass to measure height */
  const measure=()=>{
    let y=pad;
    lines.forEach(l=>{
      if(l.t==='gap'){ y+=l.h||18; return; }
      if(l.t==='rule'){ y+=18; return; }
      if(l.t==='img'){ y+=(l.h||220)+16; return; }
      if(l.t==='sig'){ y+=150; return; }
      ctx.font=font(l.size||18,l.weight);
      const words=String(l.text||'').split(' ');
      let line='', rows=1;
      words.forEach(w=>{ const test=line?line+' '+w:w;
        if(ctx.measureText(test).width>W-pad*2-(l.indent||0)){ line=w; rows++; } else line=test; });
      y+=rows*((l.size||18)+8)+(l.after||0);
    });
    return y+pad;
  };
  c.width=W; c.height=Math.max(560, measure());
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#111111'; ctx.textBaseline='top';
  if(logo) ctx.drawImage(logo, W-pad-logoW, pad, logoW, logoH);
  let y=pad;
  lines.forEach(l=>{
    if(l.t==='gap'){ y+=l.h||18; return; }
    if(l.t==='rule'){ ctx.strokeStyle=l.strong?'#111':'#d5d5d5'; ctx.lineWidth=l.strong?2:1;
      ctx.beginPath(); ctx.moveTo(pad,y+8); ctx.lineTo(W-pad,y+8); ctx.stroke(); y+=18; return; }
    if(l.t==='img'&&l.img){ const h=l.h||220, w=Math.min(W-pad*2, l.img.width*(h/l.img.height));
      ctx.drawImage(l.img,pad,y,w,h); y+=h+16; return; }
    if(l.t==='sig'){
      const boxW=(W-pad*2-40)/2;
      [[l.leftLabel,l.leftName,l.leftImg,pad],[l.rightLabel,l.rightName,l.rightImg,pad+boxW+40]].forEach(([lab,nm,im,x])=>{
        if(im){ const h=90, w=Math.min(boxW, im.width*(h/im.height)); ctx.drawImage(im,x,y,w,h); }
        ctx.strokeStyle='#111'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x,y+100); ctx.lineTo(x+boxW,y+100); ctx.stroke();
        const fit=(t,px,w)=>{ ctx.font=px; t=String(t||'');
          if(ctx.measureText(t).width<=w) return t;
          while(t.length>3 && ctx.measureText(t+'…').width>w) t=t.slice(0,-1);
          return t+'…'; };
        ctx.fillStyle='#555'; ctx.fillText(fit(lab,font(14),boxW),x,y+106);
        ctx.fillStyle='#111'; ctx.fillText(fit(nm,font(17,600),boxW),x,y+126);
      });
      y+=150; return;
    }
    ctx.fillStyle=l.colour||'#111111';
    ctx.font=font(l.size||18,l.weight);
    const words=String(l.text||'').split(' ');
    let line='', x=pad+(l.indent||0);
    /* keep the first couple of lines clear of the logo */
    const room = (logo && y<pad+logoH) ? W-pad*2-(l.indent||0)-logoW-24 : W-pad*2-(l.indent||0);
    words.forEach(w=>{ const test=line?line+' '+w:w;
      if(ctx.measureText(test).width>room){ ctx.fillText(line,x,y); y+=(l.size||18)+8; line=w; }
      else line=test; });
    ctx.fillText(line,x,y); y+=(l.size||18)+8+(l.after||0);
  });
  return c;
}

/* ---------- location ---------- */
function parseLocation(text){
  const t=String(text||'').trim();
  const pats=[/@(-?\d+\.\d+),(-?\d+\.\d+)/, /[?&](?:q|ll|daddr)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/,
              /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /^(-?\d{1,2}\.\d+)[, ]+\s*(-?\d{1,3}\.\d+)$/];
  for(const p of pats){ const m=t.match(p); if(m){ const lat=+m[1],lng=+m[2];
    if(Math.abs(lat)<=90&&Math.abs(lng)<=180) return {lat,lng}; } }
  return null;
}
const mapsUrl=l=>'https://www.google.com/maps/search/?api=1&query='+l.lat+','+l.lng;
function haversine(a,b){ const R=6371,rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat),dLng=rad(b.lng-a.lng);
  const q=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(q)); }
function pinHere(cb){
  if(!navigator.geolocation){ toast('This device will not give a location — paste a map link instead'); return; }
  toast('Getting the location…');
  navigator.geolocation.getCurrentPosition(
    p=>cb({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6)}),
    e=>toast(e&&e.code===1?'Location permission refused — paste a map link instead':'Could not get a location here'),
    {enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}

/* ---------- a photo of the site ---------- */
function pickPhoto(cb){
  const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.setAttribute('capture','environment');
  i.onchange=()=>{ const f=i.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>shrinkPhoto(r.result,cb); r.readAsDataURL(f); };
  i.click();
}
function shrinkPhoto(src,cb){
  const img=new Image();
  img.onload=()=>{ const max=900; let w=img.width,h=img.height;
    const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
    let out=c.toDataURL('image/jpeg',0.6);
    if(out.length>320000) out=c.toDataURL('image/jpeg',0.42);
    cb(out); };
  img.onerror=()=>toast('That picture could not be read');
  img.src=src;
}

function pickLogo(cb){

        const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);   /* PNG keeps a see-through background */

/* ---------- looking the site up ---------- */
const addressUrl=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a);
function bearing(a,b){
  const rad=x=>x*Math.PI/180, deg=x=>x*180/Math.PI;
  const dLng=rad(b.lng-a.lng);
  const y=Math.sin(dLng)*Math.cos(rad(b.lat));
  const x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(dLng);
  return (deg(Math.atan2(y,x))+360)%360;
}
const compass=d=>['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16];
/* No street map can load inside the page, so this shows the site against the
   yard — direction, distance and north — which is what works with no signal. */
function miniMap(j){
  const loc=j.location, yard=S.settings.yard;
  if(!loc) return '';
  const W=320,H=200,cx=W/2,cy=H/2;
  if(!yard) return `<svg class="minimap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Site pin">
      <circle cx="${cx}" cy="${cy}" r="9" fill="var(--accent)"/>

      <text x="${cx}" y="${cy+30}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)}</text>
      <text x="10" y="${H-10}" font-size="10" fill="var(--ink-2)">Pin the yard in Settings to see the direction and distance.</text></svg>`;
  const dist=haversine(yard,loc), brg=bearing(yard,loc);
  const r=Math.min(W,H)/2-40;
  const sx=cx+r*Math.sin(brg*Math.PI/180), sy=cy-r*Math.cos(brg*Math.PI/180);
  return `<svg class="minimap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Site relative to the yard">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>
    <line x1="${cx}" y1="${cy}" x2="${sx}" y2="${sy}" stroke="var(--accent)" stroke-width="2"/>
    <rect x="${cx-6}" y="${cy-6}" width="12" height="12" fill="var(--ink-2)" transform="rotate(45 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+22}" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="var(--cond)">YARD</text>
    <circle cx="${sx}" cy="${sy}" r="8" fill="var(--accent)"/>
    <text x="${sx}" y="${sy-13}" text-anchor="middle" font-size="11" fill="var(--ink)" font-family="var(--cond)">SITE</text>
    <text x="12" y="20" font-size="11" fill="var(--ink-2)" font-family="var(--cond)">N ↑</text>
    <text x="${W-12}" y="${H-12}" text-anchor="end" font-size="12" fill="var(--ink)">
      ${dist<1? Math.round(dist*1000)+' m':dist.toFixed(1)+' km'} ${compass(brg)} of the yard</text>
  </svg>`;
}

/* ---------- colour ---------- */
function hexToRgb(h){ h=String(h||'').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h||'1d4667',16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
const toHex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
function toHsl(hex){ const {r,g,b}=hexToRgb(hex),R=r/255,G=g/255,B=b/255;
  const mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/2; let h=0,s=0;
  if(mx!==mn){ const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h=mx===R?(G-B)/d+(G<B?6:0):mx===G?(B-R)/d+2:(R-G)/d+4; h/=6; }
  return {h,s,l}; }
function fromHsl(h,s,l){ const f=(p,q,t)=>{t=(t+1)%1;return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p;};
  if(s===0){const v=l*255;return toHex(v,v,v);}
  const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;
  return toHex(f(p,q,h+1/3)*255,f(p,q,h)*255,f(p,q,h-1/3)*255); }
const lighten=hex=>{const {h,s}=toHsl(hex);return fromHsl(h,Math.min(.55,s*.85),.72);};
const inkOn=hex=>{const {r,g,b}=hexToRgb(hex);return (0.2126*r+0.7152*g+0.0722*b)/255>0.55?'#0b1620':'#ffffff';};
function themePref(){ if(themeMode) return themeMode;
  try{ return localStorage.getItem(LS_THEME)||'system'; }catch(e){ return 'system'; } }
function setTheme(v){ themeMode=v; try{ localStorage.setItem(LS_THEME,v); }catch(e){} applyColour(); paintPop(); }
function darkNow(){ const p=themePref();
  return p==='dark' || (p==='system' && window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches); }
function applyColour(){
  const root=document.documentElement, p=themePref();
  if(p==='light'||p==='dark') root.dataset.theme=p; else delete root.dataset.theme;
  const base=(S&&S.settings&&S.settings.colour)||'#1d4667';
  const acc=darkNow()? lighten(base) : base;
  root.style.setProperty('--accent',acc);
  root.style.setProperty('--accent-ink',inkOn(acc));
}
if(window.matchMedia) matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyColour);
function paintPop(){
  const base=(S.settings.colour||'#1d4667').toLowerCase();
  document.getElementById('swatches').innerHTML =
    COLOURS.map(c=>`<button class="sw ${base===c.hex?'on':''}" data-colour="${c.hex}" style="background:${c.hex}" title="${c.name}" aria-label="${c.name}"></button>`).join('')
    + `<label class="sw custom ${COLOURS.every(c=>c.hex!==base)?'on':''}" title="Pick your own"><input type="color" id="colourPick" value="${esc(S.settings.colour||'#1d4667')}"></label>`;
  document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',String(themePref()===b.dataset.mode)));
}

/* ---------- storage ---------- */
let saveTimer=null, dirty=false;

/* Older trackers held tasks, questions, photos and a verify step. Keep the
   jobs and the dates that matter; quietly drop the rest. */
function upgrade(st){
  if(!st || !Array.isArray(st.jobs)) return null;
  if(st.v===2) return st;
  const out=blankState();
  out.company=st.company||out.company;
  out.seq=st.seq||1;
  out.settings=Object.assign(out.settings,{
    currency:(st.settings&&st.settings.currency)||'£',
    inspectionDays:(st.settings&&st.settings.inspectionDays)||7,
    inspections:true,
    colour:(st.settings&&st.settings.accent)||'#1d4667',
    yard:(st.settings&&st.settings.yard)||null
  });
  out.members=(st.members||[]).map(m=>({id:m.id,name:m.name,role:m.role||'',initials:m.initials||initials(m.name||'?'),active:true}));
  out.jobs=(st.jobs||[]).map(j=>{
    const d=j.dates||{};
    const status = (j.status==='down'||j.status==='complete') ? 'down' : (j.status==='up'||j.status==='offhire') ? 'up' : 'booked';
    const oldNotes=[j.desc, ...(j.questions||[]).map(q=>'Q: '+q.text+((q.answers||[]).length?' — '+q.answers.map(a=>a.text).join(' / '):''))]
      .filter(Boolean).join('\n');
    const job={ id:j.id, ref:j.ref, client:j.client||'', site:j.site||'', contact:j.contact||'', phone:j.phone||'',
      notes:oldNotes, status, value:j.value||0, hireRate:j.hireRate||0, crew:j.crew||[], location:j.location||null,
      dates:{erect:d.erect||'', up:d.erected||'', dismantle:d.dismantle||'', down:d.dismantled||''},
      inspection:{next:'',last:'',by:''}, activity:j.activity||[],
      createdAt:j.createdAt||nowISO(), updatedAt:j.updatedAt||nowISO() };
    if(status==='up' && job.dates.up) job.inspection.next=plus(job.dates.up, out.settings.inspectionDays);
    return job;
  });
  return out;
}

async function initStorage(){
  const embedded=(()=>{ try{ return JSON.parse(document.getElementById('app-state').textContent); }catch(e){ return null; } })();
  let cap=null;
  try{ if(window.claude&&claude.use) cap=await claude.use('artifact'); }catch(e){}
  if(cap){
    try{
      const html=await (await fetch(location.href,{cache:'no-store'})).text();
      const m=html.match(/(<script id="app-state" type="application\/json">)([\s\S]*?)(<\/script>)/);
      if(m){ tpl=[html.slice(0,m.index+m[1].length), html.slice(m.index+m[1].length+m[2].length)]; mode='shared'; }
    }catch(e){}
  }
  let base = mode==='shared' ? embedded : (()=>{ try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ return null; } })() || embedded;
  S = upgrade(base) || blankState();
  S.settings=Object.assign(blankState().settings,S.settings||{});
  try{ me=localStorage.getItem(LS_ME)||null; }catch(e){}
  if(me&&!member(me)) me=null;
  applyColour();
}

function save(){
  S.updatedAt=nowISO();
  try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){}
  if(mode!=='shared') return;
  dirty=true; showSaving(); clearTimeout(saveTimer); saveTimer=setTimeout(publishNow,2500);
}
/* Sharing works by republishing the page, and the shell then reloads every open
   view — this one included. So: never do it mid-typing, and put the screen back
   exactly where it was afterwards. */
function busyTyping(){
  const a=document.activeElement;
  return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
}
function stashUi(){
  try{ sessionStorage.setItem(SS_UI, JSON.stringify({
    view, openJob, y:window.scrollY,
    drawer: document.getElementById('drawer').classList.contains('on')
  })); }catch(e){}
}
function restoreUi(){
  let u=null; try{ u=JSON.parse(sessionStorage.getItem(SS_UI)||'null'); }catch(e){}
  try{ sessionStorage.removeItem(SS_UI); }catch(e){}
  if(!u) return false;
  if(u.view) view=u.view;
  const back = u.drawer && u.openJob && S.jobs.some(j=>j.id===u.openJob);
  openJob = back? u.openJob : null;
  render();
  if(back) drawJob();
  if(u.y) setTimeout(()=>window.scrollTo(0,u.y),0);
  return true;
}
async function publishNow(){
  if(mode!=='shared'||!tpl) return;
  if(busyTyping()){ clearTimeout(saveTimer); saveTimer=setTimeout(publishNow,1500); return; }
  const cap=await claude.use('artifact'); if(!cap) return;
  stashUi();
  try{ await cap.publish(tpl[0]+JSON.stringify(S).replace(/<\//g,'<\\/')+tpl[1]); dirty=false; showSaving(); }
  catch(err){
    const c=err&&err.code;
    if(c==='conflict') return;
    if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'){
      mode='readonly'; roMsg='You can look but not change anything here — ask whoever owns the tracker for access.'; render(); }
    else if(c==='rate_limited'){ clearTimeout(saveTimer); saveTimer=setTimeout(publishNow,4000); }
    else { mode='local'; roMsg='Changes are being kept on this device only.'; render(); }
  }
}
const canWrite=()=>mode!=='readonly';
function guard(){ if(!canWrite()){ toast('You cannot change this tracker'); return false; }
  if(!me){ pickMe(); return false; } return true; }

/* ---------- views ---------- */
function render(){
  document.getElementById('brandName').textContent=S.company||'Scaffold Tracker';
  document.title=(S.company? S.company+' — ':'')+'Scaffold Job Tracker';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.view===view)));
  document.getElementById('whoBtn').textContent = me? mName(me).split(' ')[0] : 'Sign in';
  document.getElementById('app').innerHTML =
    (roMsg?`<div class="banner">${esc(roMsg)}</div>`:'') +
    ({today:vToday, jobs:vJobs, cal:vCal, docs:vDocs, settings:vSettings}[view]||vToday)();
  if(openJob && S.jobs.some(j=>j.id===openJob)) drawJob();
  paintPop();
}

  const late=lateReason(j);
  return `<div class="card job" data-job="${j.id}">
    <div class="hd">${j.photo?`<img class="thumb" src="${j.photo}" alt="">`:''}<strong>${esc(j.client||'Untitled job')}</strong>
      <span class="tag ${isUp(j)?'up':''}">${STATUS[j.status].label}</span></div>
    <div class="small muted">${esc(j.site||'No address')} · ${j.ref}</div>
    <div class="line small">
      ${isUp(j)? `<span class="tag up">Up ${daysUp(j)} days${j.hireRate?' · '+money(hireEarned(j)):''}</span>`
        : j.status==='booked'&&j.dates.erect? `<span class="tag">Up ${fmt(j.dates.erect)} · ${rel(j.dates.erect)}</span>`
        : j.dates.down? `<span class="tag">Down ${fmt(j.dates.down)}</span>`:''}
      ${isUp(j)&&j.dates.dismantle? `<span class="tag">Down ${fmt(j.dates.dismantle)}</span>`:''}
      ${(j.crew||[]).map(avatar).join('')}
    </div>
    ${late? `<div class="line"><span class="tag late">${esc(late)}</span></div>`:''}
  </div>`;
}

function vJobs(){
  let list=S.jobs.slice();
  if(filter.status==='active') list=list.filter(isActive);
  else if(filter.status!=='all') list=list.filter(j=>j.status===filter.status);
  if(filter.q){ const q=filter.q.toLowerCase();
    list=list.filter(j=>[j.client,j.site,j.ref,j.notes,j.contact].join(' ').toLowerCase().includes(q)); }
  const order={booked:0,up:1,down:2};
  list.sort((a,b)=>(order[a.status]-order[b.status]) || ((a.dates.erect||'9')<(b.dates.erect||'9')?-1:1));
  return `<div class="sec"><h2>Jobs</h2><button class="btn sm" data-act="newjob">+ New job</button></div>
  <div class="chips">
    ${[['active','Active'],['booked','Booked in'],['up','Up'],['down','Down'],['all','All']]
      .map(([k,l])=>`<button data-filter="${k}" aria-pressed="${filter.status===k}">${l}</button>`).join('')}
  </div>
  <input type="text" id="qbox" placeholder="Search client, address, ref…" value="${esc(filter.q)}" style="margin-bottom:12px">
  <div class="stack">${list.length? list.map(jobCard).join('') : '<div class="card empty">No jobs here yet.</div>'}</div>`;
}

function vCal(){
  const cur=calCursor? new Date(calCursor) : new Date();
  const y=cur.getFullYear(), m=cur.getMonth();
  const first=new Date(y,m,1), start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const cells=[]; const d=new Date(start);
  for(let i=0;i<42;i++){ cells.push(new Date(d)); d.setDate(d.getDate()+1); }
  const evs=jobEvents(isoOf(cells[0]), isoOf(cells[41]));
  const byDay={}; evs.forEach(e=>(byDay[e.date]=byDay[e.date]||[]).push(e));
  return `<div class="sec"><h2>${cur.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2>
    <div class="row"><button class="btn sm ghost" data-cal="-1">‹</button>
      <button class="btn sm ghost" data-cal="0">Today</button>
      <button class="btn sm ghost" data-cal="1">›</button></div></div>
  <div class="cal">
    ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('')}
    ${cells.map(c=>{ const iso=isoOf(c), list=byDay[iso]||[];
      return `<div class="day ${c.getMonth()!==m?'off':''} ${iso===todayISO()?'today':''}">
        <div class="dn">${c.getDate()}</div>
        ${list.slice(0,3).map(e=>`<div class="ev ${e.kind}" data-job="${e.job.id}" title="${esc(e.label)}">${esc(e.label)}</div>`).join('')}
        ${list.length>3?`<div class="tiny muted">+${list.length-3}</div>`:''}</div>`; }).join('')}
  </div>
  <div class="row small muted" style="margin-top:10px;gap:14px;flex-wrap:wrap">
    <span><span class="tag up">Going up</span></span><span><span class="tag">Coming down</span></span>
    ${S.settings.inspections?'<span><span class="tag late">Inspection due</span></span>':''}
  </div>`;
}

/* Every handover issued, newest first — the folder you reach for when someone asks. */
function vDocs(){
  const list=S.jobs.filter(j=>j.handover && j.handover.signature)
    .sort((a,b)=>(b.handover.date||'').localeCompare(a.handover.date||''));
  const q=(filter.q||'').toLowerCase();
  const shown=q? list.filter(j=>[j.client,j.site,j.ref,j.handover.no,j.handover.clientName].join(' ').toLowerCase().includes(q)) : list;
  const unsigned=S.jobs.filter(j=>!j.handover && j.dates.up && j.status==='up');
  return `<div class="sec"><h2>Handovers</h2><span class="tag">${list.length} issued</span></div>
  <p class="small muted" style="margin:0 0 12px">Each one is the certificate <em>and</em> the record of the inspection before first use. Keep them for at least three months — the law asks for that, and a client asking two months later is the reason.</p>
  ${list.length>3? `<input type="text" id="qbox" placeholder="Search client, site, certificate…" value="${esc(filter.q)}" style="margin-bottom:12px">`:''}
  <div class="stack">
    ${shown.length? shown.map(j=>{
      const h=j.handover;
      return `<div class="card job" data-doc="${j.id}">
        <div class="hd"><strong>${esc(j.client||'Untitled job')}</strong><span class="tag">${esc(h.no||'')}</span></div>
        <div class="small muted">${esc(j.site||'No address')} · ${j.ref}</div>
        <div class="line small">
          <span class="tag">${fmt(h.date)}</span>
          <span class="tag">${esc((h.load||'').split('—')[0].trim())}</span>
          ${h.clientName? `<span class="tag">signed by ${esc(h.clientName)}</span>`:''}
        </div>
        <div class="tiny muted">Handed over by ${esc(mName(h.by))}${h.time? ' at '+esc(h.time):''}</div>
      </div>`; }).join('')
    : `<div class="card empty">${q? 'Nothing matches that.' : 'No handovers issued yet. Open a job and press Handover.'}</div>`}
  </div>
  ${unsigned.length? `<div class="sec"><h3>Up, but never handed over</h3></div>
    <div class="stack">${unsigned.map(jobCard).join('')}</div>
    <p class="small muted">A scaffold in use without a handover leaves you carrying the risk. Worth five minutes each.</p>`:''}`;
}

/* ---------- drawer ---------- */
function openDrawer(title,html){
  document.getElementById('drawerTitle').textContent=title;
  document.getElementById('drawerBody').innerHTML=html;
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeDrawer(){ openJob=null; pendingYes=null;
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('scrim').classList.remove('on'); }

function drawJob(){
  const j=S.jobs.find(x=>x.id===openJob); if(!j) return closeDrawer();
  const loc=j.location, dist=(loc&&S.settings.yard)? haversine(S.settings.yard,loc) : null;
  const insp=inspectionDue(j), showInsp=S.settings.inspections && isUp(j);
  openDrawer(j.ref+(j.client?' · '+j.client:''), `
    <div class="stack">
      ${j.status==='booked'? `<button class="btn big up" data-act="markup" data-jid="${j.id}">Scaffold is UP</button>`:''}
      ${j.status==='up'? `<button class="btn big" data-act="markdown" data-jid="${j.id}">Scaffold is DOWN</button>`:''}
      <div class="row" style="flex-wrap:wrap">
        <button class="btn sm ghost" data-act="dupe" data-jid="${j.id}">Copy for the same client</button>
        <button class="btn sm ghost" data-act="sheet" data-jid="${j.id}">Job sheet</button>
        <button class="btn sm ghost" data-act="cert" data-jid="${j.id}">Handover${j.handover?' ✓':''}</button>
      </div>

      ${j.status==='down'? `<div class="card pad"><strong>Finished.</strong> Up ${fmt(j.dates.up)}, down ${fmt(j.dates.down)} — ${daysUp(j)} days${j.hireRate?', '+money(hireEarned(j))+' hire':''}.
        <div style="margin-top:10px"><button class="btn sm ghost" data-act="reopen" data-jid="${j.id}">Put it back up</button></div></div>`:''}

      ${showInsp? `<div class="card pad">
        <div class="row"><span class="tag ${inspectionLate(j)?'late':''}">${insp? 'Inspection '+(inspectionLate(j)?'was due ':'due ')+fmt(insp) : 'No inspection booked'}</span>

/* a signature pad that works with a finger, a pen or a mouse */
let sigDrawn=false;
function initSigPad(){
  const c=document.getElementById('sigPad'); if(!c) return;
  const r=c.getBoundingClientRect();
  c.width=Math.round(r.width*2); c.height=Math.round(r.height*2);
  const ctx=c.getContext('2d'); ctx.scale(2,2);
  ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111';
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  let drawing=false;
  const pos=e=>{ const b=c.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; };
  c.addEventListener('pointerdown',e=>{ drawing=true; sigDrawn=true; c.setPointerCapture(e.pointerId);
    const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); });
  c.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); });
  const stop=()=>{ drawing=false; };
  c.addEventListener('pointerup',stop); c.addEventListener('pointercancel',stop); c.addEventListener('pointerleave',stop);
  sigDrawn=false;
}
/* The pad is drawn at twice the screen size so it looks sharp; store it small,
   or every save carries a fat picture around with it. */
function shrinkSignature(pad){
  const max=560;
  const k=Math.min(1, max/pad.width);
  const c=document.createElement('canvas');
  c.width=Math.round(pad.width*k); c.height=Math.round(pad.height*k);
  const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
  x.drawImage(pad,0,0,c.width,c.height);
  return c.toDataURL('image/png');
}
function wipeSigPad(){ const c=document.getElementById('sigPad'); if(!c) return;
  const ctx=c.getContext('2d'); ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.restore(); sigDrawn=false; }

/* ---------- events ---------- */
const val=id=>{const e=document.getElementById(id);return e?String(e.value||'').trim():'';};

document.addEventListener('click', async e=>{
  const pop=document.getElementById('colourPop');
  if(!e.target.closest('#colourPop') && !e.target.closest('#colourBtn')) pop.classList.remove('on');

  const t=e.target.closest('[data-view],[data-job],[data-act],[data-filter],[data-cal],[data-beme],[data-rmperson],[data-colour],[data-mode],[data-datepick],[data-pickday],[data-dpmove],[data-backjob],[data-doc]');
  if(!t) return;
  const j=t.dataset.jid? S.jobs.find(x=>x.id===t.dataset.jid) : null;

  if(t.dataset.view){ view=t.dataset.view; filter.q=''; closeDrawer(); render(); scrollTo(0,0); return; }
  if(t.dataset.filter){ filter.status=t.dataset.filter; render(); return; }
  if(t.dataset.cal!==undefined&&t.dataset.cal!==''){ const n=+t.dataset.cal;
    const c=n===0? new Date() : (()=>{const d=calCursor?new Date(calCursor):new Date(); d.setDate(1); d.setMonth(d.getMonth()+n); return d;})();
    calCursor=c.toISOString(); render(); return; }
  if(t.dataset.colour){ if(!canWrite()) return toast('You cannot change this tracker');
    S.settings.colour=t.dataset.colour; applyColour(); save(); paintPop(); return; }
  if(t.dataset.mode){ setTheme(t.dataset.mode); return; }
  if(t.dataset.beme){ me=t.dataset.beme; try{localStorage.setItem(LS_ME,me);}catch(err){}
    closeDrawer(); render(); toast('Signed in as '+mName(me)); return; }
  if(t.dataset.rmperson){ if(!canWrite()) return toast('You cannot change this tracker');
    const id=t.dataset.rmperson;
    askFirst('Remove '+esc(mName(id))+'?','They come off every job they are on. What they have already done stays in the history.','Remove them',
      ()=>{ S.members=S.members.filter(m=>m.id!==id);
        S.jobs.forEach(x=>x.crew=(x.crew||[]).filter(c=>c!==id));
        if(me===id){ me=null; try{localStorage.removeItem(LS_ME);}catch(e){} }
        closeDrawer(); save(); render(); toast('Removed'); });
    return; }
  if(t.dataset.backjob){ openJob=t.dataset.backjob; drawJob(); return; }
  if(t.dataset.datepick){ const key=t.dataset.datepick;
    if(njDraft && key.startsWith('nj:')) grabDraft();
    dpOpen = dpOpen===key? null : key;
    dpCursor=null;
    if(key.startsWith('nj:')) formNewJob(); else drawJob();
    return; }
  if(t.dataset.dpmove){ const n=+t.dataset.dpmove;
    const base=dpCursor || (dpOpen && (dpOpen.startsWith('nj:')? njDraft[dpOpen.split(':')[1]] : (S.jobs.find(x=>x.id===openJob)||{dates:{}}).dates[dpOpen.split(':')[1]])) || todayISO();
    const d=new Date(base+'T00:00:00'); d.setDate(1); d.setMonth(d.getMonth()+n); dpCursor=isoOf(d);
    if(njDraft && dpOpen && dpOpen.startsWith('nj:')){ grabDraft(); formNewJob(); } else drawJob();
    return; }
  if(t.dataset.pickday!==undefined && t.dataset.pickday!==null && t.dataset.pickday!==''){
    const parts=t.dataset.pickday.split(':');
    if(njDraft && parts[0]==='nj') grabDraft();
    setPicked(parts[0],parts[1],parts[2]||'');
    return; }
  if(t.dataset.doc){ const dj=S.jobs.find(x=>x.id===t.dataset.doc); if(dj) docView(dj,'cert'); return; }
  if(t.dataset.job){ openJob=t.dataset.job; drawJob(); return; }

  const act=t.dataset.act;
  if(act==='newjob') return formNewJob(true);
  if(act==='njphoto'){ grabDraft(); pickPhoto(url=>{ njDraft.photo=url; formNewJob(); toast('Photo added'); }); return; }
  if(act==='njphotoclear'){ grabDraft(); njDraft.photo=null; formNewJob(); return; }

  if(act==='createjob'){
    if(!canWrite()) return toast('You cannot change this tracker');
    grabDraft();
    const j2=newJob({client:njDraft.client.trim(), site:njDraft.site.trim(), notes:njDraft.notes,
      value:+njDraft.value||0, hireRate:+njDraft.hire||0, photo:njDraft.photo||null,
      dates:{erect:njDraft.erect||'', up:'', dismantle:njDraft.dismantle||'', down:''}});
    njDraft=null; dpOpen=null;
    openJob=j2.id; render(); drawJob(); toast('Job created'); return;
  }
  if(act==='markup'&&j) return markUp(j);
  if(act==='markdown'&&j) return markDown(j);
  if(act==='inspected'&&j) return markInspected(j);
  if(act==='reopen'&&j){ if(!guard())return; j.status='up'; j.dates.down='';
    if(S.settings.inspections) j.inspection={next:plus(todayISO(),Number(S.settings.inspectionDays)||7),last:j.inspection.last,by:j.inspection.by};
    log(j,'put the scaffold back up'); save(); render(); drawJob(); return; }
  if(act==='dupe'&&j) return duplicateJob(j);
  if(act==='sheet'&&j) return docView(j,'sheet');
  if(act==='cert'&&j){ if(j.handover) return docView(j,'cert'); return handoverForm(j); }
  if(act==='handover'&&j) return handoverForm(j);
  if(act==='sigwipe'){ wipeSigPad(); return; }
  if(act==='sigclear'&&j){ if(!guard())return; j.handover=Object.assign({},j.handover,{signature:''}); save(); handoverForm(j); return; }
  if(act==='hosave'&&j){
    if(!guard()) return;
    const pad=document.getElementById('sigPad');
    let sig=(j.handover&&j.handover.signature)||'';
    if(pad && sigDrawn) sig=shrinkSignature(pad);
    if(!sig){ toast('Ask them to sign first'); return; }
    j.handover={no:val('hoNo')||certNo(j), clientName:val('hoWho'), load:val('hoLoad'),
      type:val('hoType'), size:val('hoSize'), designBasis:val('hoBasis'), designRef:val('hoRef'),
      limits:val('hoLimits'), remedy:val('hoRemedy'), time:val('hoTime'),
      signature:sig, by:me, date:todayISO()};
    log(j,'handed the scaffold over to '+(j.handover.clientName||'the client'));
    save(); render(); docView(j,'cert'); toast('Handover saved');
    return;
  }
  if(act==='docsave'&&j){
    const kind=t.dataset.kind;
    const c=await (kind==='cert'? certCanvas(j) : jobSheetCanvas(j));
    await saveCanvas(c, (kind==='cert'? 'handover-':'job-sheet-')+j.ref+'.png');
    return;
  }
  if(act==='jobphoto'&&j){ if(!guard())return;
    pickPhoto(url=>{ j.photo=url; log(j,'added a photo of the site'); save(); render(); drawJob(); toast('Photo added'); }); return; }
  if(act==='jobphotoclear'&&j){ if(!guard())return;
    askFirst('Remove the photo?','The picture of this site goes. Nothing else changes.','Remove it',
      ()=>{ j.photo=null; log(j,'removed the site photo'); save(); openJob=j.id; render(); drawJob(); }); return; }
  if(act==='viewphoto'&&j&&j.photo){ openJob=j.id;
    openDrawer('Site photo', `<img class="photo" src="${j.photo}" alt="">
      <div class="row" style="margin-top:12px"><button class="btn ghost" data-backjob="${j.id}">Back to the job</button></div>`);
    return; }
  if(act==='deljob'&&j) return deleteJob(j);
  if(act==='pinhere'&&j){ if(!guard())return;
    pinHere(loc=>{ j.location=loc; log(j,'pinned where the job is'); save(); render(); drawJob(); toast('Location pinned'); }); return; }
  if(act==='pinpaste'&&j){ if(!guard())return;
    const loc=parseLocation(val('locPaste'));
    if(!loc) return toast('That was not a map link or a pair of coordinates');
    j.location=loc; log(j,'set where the job is'); save(); render(); drawJob(); return; }
  if(act==='unpin'&&j){ if(!guard())return; j.location=null; log(j,'cleared the location'); save(); render(); drawJob(); return; }
  if(act==='logopick'){ if(!canWrite()) return toast('You cannot change this tracker');
    pickLogo(url=>{ S.settings.logo=url; save(); render(); toast('Logo added'); }); return; }
  if(act==='logoclear'){ if(!canWrite()) return toast('You cannot change this tracker');
    S.settings.logo=null; save(); render(); return; }
  if(act==='yardhere'){ if(!canWrite()) return toast('You cannot change this tracker');
    pinHere(loc=>{ S.settings.yard=loc; save(); render(); toast('Yard pinned'); }); return; }
  if(act==='yardpaste'){ if(!canWrite()) return toast('You cannot change this tracker');
    const loc=parseLocation(val('yardPaste')); if(!loc) return toast('That was not a map link or coordinates');
    S.settings.yard=loc; save(); render(); return; }
  if(act==='yardclear'){ if(!canWrite()) return toast('You cannot change this tracker'); S.settings.yard=null; save(); render(); return; }
  if(act==='addperson'){ if(!canWrite()) return toast('You cannot change this tracker');
    openDrawer('Add someone',`<div class="card pad stack">
      <div><label class="f">Name</label><input type="text" id="pName"></div>
      <div><label class="f">Job</label><select id="pRole">${['Manager','Chargehand','Scaffolder','Labourer','Driver','Office'].map(r=>`<option>${r}</option>`).join('')}</select></div>
      <div><label class="f">CISRS card number <span class="muted" style="text-transform:none">— printed on handover certificates</span></label>
        <input type="text" id="pCard" placeholder="optional"></div>
      <div><button class="btn" data-act="saveperson">Add</button></div></div>`); return; }
  if(act==='saveperson'){ if(!canWrite()) return toast('You cannot change this tracker');
    const n=val('pName'); if(!n) return toast('Give them a name');
    addMember(n,val('pRole'),val('pCard')); closeDrawer(); render(); return; }
  if(act==='quickme'){ const n=val('quickMe'); if(!n) return;
    const m=addMember(n,'Scaffolder'); me=m.id; try{localStorage.setItem(LS_ME,me);}catch(err){}
    closeDrawer(); render(); return; }
  if(act==='savesettings'){ if(!canWrite()) return toast('You cannot change this tracker');
    S.company=val('setCompany'); S.settings.currency=val('setCur')||'£';
    S.settings.inspectionDays=+val('setDays')||7;
    S.settings.details=val('setDetails');
    S.settings.inspections=document.getElementById('setInsp').checked;
    reseedInspections();
    save(); render(); toast('Saved'); return; }
  if(act==='export') return exportBackup();
  if(act==='import'){
    openDrawer('Import backup',`<p class="small muted">Pick a backup file or paste one in. This replaces everything here.</p>
      <div class="card pad stack"><input type="file" id="impFile" accept=".json,application/json">
      <textarea id="impText" placeholder="…or paste the backup" style="min-height:160px"></textarea>
      <div><button class="btn" data-act="doimport">Replace my data</button></div></div>`);
    document.getElementById('impFile').onchange=function(){ const f=this.files[0]; if(!f) return;
      const r=new FileReader(); r.onload=()=>{ document.getElementById('impText').value=r.result; toast('Loaded — press Replace'); }; r.readAsText(f); };
    return; }
  if(act==='doimport'){ if(!canWrite()) return toast('You cannot change this tracker');
    try{ const d=upgrade(JSON.parse(val('impText'))); if(!d) throw 0;
      S=d; S.settings=Object.assign(blankState().settings,S.settings||{});
      applyColour(); save(); closeDrawer(); render(); toast('Imported'); }
    catch(err){ toast('That was not a tracker backup'); } return; }
  if(act==='print'){ window.print(); return; }
  if(act==='wipe'){ if(!canWrite()) return toast('You cannot change this tracker');
    askFirst('Erase everything?','Every job and every person goes. Export a backup first if there is any chance you want this back.','Erase it all',
      ()=>{ S=blankState(); me=null; applyColour(); save(); closeDrawer(); render(); toast('Erased'); });
    return; }
  if(act==='yes'){ const fn=pendingYes; pendingYes=null; if(fn) fn(); return; }
  if(act==='no'){ pendingYes=null; if(openJob) drawJob(); else closeDrawer(); return; }
});

async function exportBackup(){
  const name='scaffold-tracker-'+todayISO()+'.json', text=JSON.stringify(S,null,2);
  let dl=null; try{ if(window.claude&&claude.use) dl=await claude.use('downloads'); }catch(e){}
  if(dl){ try{ await dl.save({filename:name,data:text}); toast('Backup saved'); }
    catch(err){ if(!err||err.code!=='declined') toast('Could not save it here'); } return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('Backup downloaded');
}

document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.nj){ grabDraft(); if(t.dataset.nj==='site') formNewJob(); return; }
  if(t.id==='colourPick'){ if(!canWrite()) return toast('You cannot change this tracker');
    S.settings.colour=t.value; applyColour(); save(); paintPop(); return; }
  const j=openJob? S.jobs.find(x=>x.id===openJob):null; if(!j) return;
  if(t.dataset.fld){ if(!guard())return; j[t.dataset.fld]=t.type==='number'? (+t.value||0) : t.value; j.updatedAt=nowISO(); save(); return; }
  if(t.dataset.date){ if(!guard())return;
    j.dates[t.dataset.date]=t.value;
    if(t.dataset.date==='up'){ if(t.value){ j.status='up';
        if(S.settings.inspections) j.inspection={next:plus(t.value,Number(S.settings.inspectionDays)||7),last:j.inspection.last,by:j.inspection.by}; }
      else if(j.status==='up') j.status='booked'; }
    if(t.dataset.date==='down'&&t.value){ j.status='down'; j.inspection={next:'',last:j.inspection.last,by:j.inspection.by}; }
    log(j,'changed a date'); save(); render(); drawJob(); return; }
  if(t.dataset.crew){ if(!guard())return; const id=t.dataset.crew;
    j.crew=t.checked? [...new Set([...(j.crew||[]),id])] : (j.crew||[]).filter(c=>c!==id);
    save(); return; }
});

document.addEventListener('input', e=>{ if(e.target.id==='qbox'){
  filter.q=e.target.value; const p=e.target.selectionStart; render();
  const b=document.getElementById('qbox'); if(b){ b.focus(); b.setSelectionRange(p,p); } } });

document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeDrawer(); document.getElementById('colourPop').classList.remove('on'); } });
document.getElementById('drawerClose').onclick=closeDrawer;
document.getElementById('scrim').onclick=closeDrawer;
document.getElementById('whoBtn').onclick=pickMe;
document.getElementById('colourBtn').onclick=()=>{ paintPop(); document.getElementById('colourPop').classList.toggle('on'); };

function routeHash(){
  const m=(location.hash||'').match(/job=([A-Za-z0-9_-]+)/); if(!m) return false;
  const j=S.jobs.find(x=>x.ref===m[1]||x.id===m[1]);
  if(j){ openJob=j.id; drawJob(); return true; }
  return false;
}
window.addEventListener('hashchange',routeHash);

function showSaving(){
  const el=document.getElementById('savingChip'); if(!el) return;
  el.textContent = dirty? 'Saving…' : 'Saved';
  el.style.opacity='1';
  clearTimeout(el._h);
  if(!dirty) el._h=setTimeout(()=>{ el.style.opacity='0'; },1400);
}

(async function(){
  await initStorage();
  const put=restoreUi();
  if(!put) render();
  const routed=routeHash();
  if(!me && S.members.length && !routed && !put) setTimeout(pickMe,400);
})();
</script>
